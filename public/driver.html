<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amazon Hub Driver</title><style>:root{--bg:#0f172a;--panel:#111827;--line:#243047;--text:#f8fafc;--muted:#94a3b8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#0b1220,#111827);color:var(--text)}.wrap{max-width:680px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.big{font-size:32px;font-weight:800;margin-top:5px}.muted,small{color:var(--muted)}input,button{width:100%;border-radius:12px;border:1px solid #334155;background:#0b1220;color:#fff;padding:12px;font-size:16px}button{font-weight:800;cursor:pointer;background:#0ea5e9}.success{color:#86efac;font-weight:700}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px;border:1px solid #243047;border-radius:10px}.profile{display:grid;grid-template-columns:1fr 1fr;gap:10px}.profile div{padding:10px;border:1px solid #243047;border-radius:10px}.pay{color:#86efac}@media(max-width:520px){.grid,.profile{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">Driver Hub</h1><div class="muted">Simple package tracker</div></div><div class="muted" id="todayLabel"></div></div><div class="card"><h2 style="margin-top:0">My Profile</h2><div class="profile"><div><small>Name</small><div class="big" style="font-size:22px" id="profileName">Driver</div></div><div><small>Role</small><div style="font-size:20px;font-weight:700;margin-top:6px">Delivery Driver</div></div><div><small>Pay Rate</small><div class="pay" style="font-size:20px;font-weight:800;margin-top:6px" id="rateText">$1.10 / package</div></div><div><small>Driver ID</small><div style="font-size:20px;font-weight:700;margin-top:6px" id="driverId">—</div></div></div></div><div class="grid"><div class="card"><small>Today's Packages</small><div class="big" id="todayPkgs">0</div></div><div class="card"><small>This Week</small><div class="big" id="weekPkgs">0</div></div><div class="card"><small>This Month</small><div class="big" id="monthPkgs">0</div></div><div class="card"><small>Estimated Pay</small><div class="big pay" id="weekPay">$0.00</div><div class="muted">This week</div></div></div><div class="card"><h2 style="margin-top:0">Enter Today's Package Count</h2><label class="muted" for="packages">Packages delivered</label><input id="packages" type="number" min="0" inputmode="numeric" placeholder="Example: 53" style="margin:8px 0 10px"><button onclick="saveToday()">Save Package Count</button><div id="savedMsg" class="success" style="margin-top:10px"></div></div><div class="card"><h2 style="margin-top:0">My Recent Counts</h2><div id="history" class="list"></div></div></div><script>const RATE=1.10;const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const name=params.get('name')||localStorage.getItem('driverHubName')||'Driver';const id=params.get('id')||localStorage.getItem('driverHubId')||name.toLowerCase().replace(/[^a-z0-9]+/g,'-');localStorage.setItem('driverHubName',name);localStorage.setItem('driverHubId',id);$('profileName').textContent=name;$('driverId').textContent=id;$('rateText').textContent='$'+RATE.toFixed(2)+' / package';function localDate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function monday(dateStr){const d=new Date(dateStr+'T12:00:00'),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return localDate(d)}function key(){return 'driverHubEntries:'+id}function getEntries(){try{return JSON.parse(localStorage.getItem(key())||'[]')}catch{return []}}function setEntries(v){localStorage.setItem(key(),JSON.stringify(v))}function saveToday(){const n=Number($('packages').value);if(!Number.isFinite(n)||n<0)return alert('Enter a valid package count.');const date=localDate(),arr=getEntries();const existing=arr.find(x=>x.date===date);if(existing)existing.packages=n;else arr.push({date,packages:n});setEntries(arr);$('packages').value='';$('savedMsg').textContent='Saved ✓';render();setTimeout(()=>$('savedMsg').textContent='',2200)}function render(){const arr=getEntries().sort((a,b)=>b.date.localeCompare(a.date)),today=localDate(),wk=monday(today),month=today.slice(0,7),todayTotal=(arr.find(x=>x.date===today)||{}).packages||0,week=arr.filter(x=>monday(x.date)===wk).reduce((s,x)=>s+(x.packages||0),0),monthTotal=arr.filter(x=>x.date.slice(0,7)===month).reduce((s,x)=>s+(x.packages||0),0);$('todayLabel').textContent=new Date().toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'});$('todayPkgs').textContent=todayTotal;$('weekPkgs').textContent=week;$('monthPkgs').textContent=monthTotal;$('weekPay').textContent='$'+(week*RATE).toFixed(2);$('packages').value=todayTotal||'';$('history').innerHTML=arr.slice(0,7).map(x=>`<div class="row"><span>${new Date(x.date+'T12:00:00').toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})}</span><b>${x.packages} packages</b></div>`).join('')||'<div class="muted">No package counts saved yet.</div>'}render()</script></body></html>
